<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小百岳紀錄</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小百岳紀錄">
<meta name="theme-color" content="#37472f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>
  :root{
    --paper:#eae5d8;
    --paper-2:#e0dac9;
    --ink:#232c22;
    --ink-soft:#5a6455;
    --moss:#4f6a52;
    --moss-dark:#37472f;
    --ochre:#b9812f;
    --clay:#a1573c;
    --brick:#7a3b2e;
    --sage:#7a9e7d;
    --line:#c9c0a8;
    --card:#f4f0e4;
    --done-bg:#e2e8d8;
    --shadow: 0 1px 2px rgba(35,44,34,0.05);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px;}

  header{
    position:relative;overflow:hidden;
    padding:48px 20px 26px;
    background:linear-gradient(180deg,var(--paper-2),var(--paper));
    border-bottom:1px solid var(--line);
  }
  header .contours{position:absolute;inset:0;opacity:0.5;pointer-events:none;}
  .header-inner{max-width:900px;margin:0 auto;position:relative;z-index:1;}
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5.6vw,42px);
    line-height:1.05;margin:0 0 16px;letter-spacing:-0.01em;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--moss);}

  .progress-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .ring{width:58px;height:58px;flex:none;}
  .stat-block{display:flex;gap:20px;flex-wrap:wrap;}
  .stat .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--moss-dark);line-height:1;}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-top:3px;}

  .trailbar{margin-top:14px;height:6px;border-radius:5px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;}
  .trailbar-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--ochre));border-radius:5px;transition:width .4s ease;}

  .sharebtn{
    display:inline-flex;align-items:center;gap:7px;margin-top:16px;
    background:var(--moss);color:#fff;border:none;border-radius:999px;padding:9px 18px;
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .sharebtn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;}

  /* ---- single search+filter row ---- */
  .searchrow{
    position:sticky;top:0;background:var(--paper);z-index:6;
    display:flex;gap:8px;padding:16px 0;border-bottom:1px solid transparent;
  }
  .searchrow.stuck{border-bottom-color:var(--line);}
  .searchbox{
    flex:1;min-width:0;display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;
  }
  .searchbox svg{width:16px;height:16px;stroke:var(--ink-soft);fill:none;stroke-width:2;flex:none;}
  .searchbox input{
    flex:1;min-width:0;width:100%;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:14.5px;
    padding:10px 0;color:var(--ink);
  }
  .searchbox input:focus{outline:none;}
  .filterbtn{
    position:relative;flex:none;display:flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .filterbtn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;}
  .filterbtn .badge{
    position:absolute;top:-5px;right:-5px;background:var(--ochre);color:#fff;
    font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---- filter panel (collapsible) ---- */
  .panel{display:none;}
  .panel.open{display:block;}
  .panel-inner{padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .panel-group{margin-bottom:14px;}
  .panel-group:last-child{margin-bottom:0;}
  .panel-label{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-soft);margin-bottom:8px;}
  .pillbar{display:flex;gap:6px;flex-wrap:wrap;}
  .pillbar.scrollrow{
    flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  .pillbar.scrollrow::-webkit-scrollbar{height:5px;}
  .pillbar.scrollrow::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
  .pillbar.scrollrow .pill{flex:none;}
  .pill{
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink-soft);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s ease;white-space:nowrap;
  }
  .pill .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .pill.active{color:#fff;border-color:transparent;}
  .pill.active.neutral{background:var(--ink);}

  /* ---- stats panel ---- */
  .statsbtn{
    flex:none;display:flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .statsbtn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2;}
  .statspanel{display:none;}
  .statspanel.open{display:block;}
  .statspanel-inner{padding:6px 0 20px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .stats-summary{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;}
  .stats-summary .stat .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--moss-dark);line-height:1;}
  .stats-summary .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-top:3px;}
  .chart{display:flex;align-items:flex-end;gap:5px;height:100px;overflow-x:auto;padding-bottom:2px;}
  .chart-col{flex:none;width:26px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .chart-bar-wrap{height:76px;display:flex;align-items:flex-end;}
  .chart-bar{width:16px;background:var(--moss);border-radius:3px 3px 0 0;min-height:2px;transition:height .3s ease;}
  .chart-bar.zero{background:var(--line);}
  .chart-count{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-soft);}
  .chart-label{font-size:9.5px;color:var(--ink-soft);white-space:nowrap;}
  .stats-empty{font-size:13px;color:var(--ink-soft);padding:10px 0;}

  /* ---- sections ---- */
  .tier-section{margin-bottom:28px;}
  .tier-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding-bottom:7px;margin-bottom:9px;border-bottom:2px solid var(--ink);}
  .tier-head h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0;}
  .tier-head .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-left:auto;}
  .tier-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}

  /* ---- peak card ---- */
  .peak{
    background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);
    border-radius:9px;margin-bottom:8px;box-shadow:var(--shadow);
    transition:background .2s ease;
  }
  .peak.done{background:var(--done-bg);}
  .peak-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer;}
  .checkbox{
    width:23px;height:23px;border-radius:7px;border:2px solid var(--moss);flex:none;
    display:flex;align-items:center;justify-content:center;background:transparent;margin-top:1px;
  }
  .checkbox:active{transform:scale(0.92);}
  .peak.done .checkbox{background:var(--moss);}
  .checkbox svg{width:14px;height:14px;stroke:var(--card);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(0.5);transition:all .15s ease;}
  .peak.done .checkbox svg{opacity:1;transform:scale(1);}
  .peak-main{flex:1;min-width:0;}
  .peak-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-right:6px;}
  .peak-name{font-weight:600;font-size:15px;}
  .peak-county{font-size:12px;color:var(--ink-soft);margin-left:6px;}
  .peak-facts{font-size:12px;color:var(--ink-soft);margin-top:4px;font-family:'JetBrains Mono',monospace;}
  .preview{margin-top:6px;font-size:12.5px;line-height:1.4;}
  .preview .pdate{color:var(--moss-dark);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .preview .ptxt{color:var(--ink-soft);}
  .chevron{width:16px;height:16px;color:var(--ink-soft);transition:transform .2s ease;flex:none;margin-top:3px;}
  .peak.open .chevron{transform:rotate(90deg);}

  .peak-detail{display:none;padding:0 14px;}
  .peak.open .peak-detail{display:block;padding:2px 14px 16px 49px;border-top:1px solid var(--line);}
  .field{margin-top:12px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:5px;}
  input[type="date"]{font-family:'Inter',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);}
  textarea{width:100%;min-height:64px;font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;line-height:1.5;}
  input[type="date"]:focus,textarea:focus{outline:2px solid var(--moss);outline-offset:1px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);font-size:13.5px;}
  footer{text-align:center;padding:30px 20px;font-size:12px;color:var(--ink-soft);}

  .save-toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--moss-dark);color:#fff;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    padding:11px 18px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.25);
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:80;max-width:88vw;text-align:center;
  }
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(35,44,34,0.55);z-index:50;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:var(--card);border-radius:14px;padding:24px;max-width:340px;width:100%;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .modal-box h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 8px;}
  .modal-box p{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 0 16px;}
  .modal-linkbox{
    display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;margin-bottom:14px;
  }
  .modal-linkbox input{
    flex:1;min-width:0;border:none;background:transparent;font-family:'JetBrains Mono',monospace;
    font-size:11.5px;color:var(--ink-soft);
  }
  .modal-linkbox input:focus{outline:none;}
  .modal-actions{display:flex;gap:8px;}
  .modal-save,.modal-copy{
    flex:1;font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:#fff;background:var(--moss);
    border:none;border-radius:8px;padding:10px 14px;cursor:pointer;
  }
  .modal-skip{
    font-size:12.5px;color:var(--ink-soft);background:none;border:none;cursor:pointer;
    text-decoration:underline;display:block;margin:12px auto 0;
  }

  @media (max-width:480px){
    .peak-county{display:none;}
  }
  @media (max-width:360px){
    .filterbtn span, .statsbtn span{display:none;}
    .filterbtn, .statsbtn{padding:0 10px;}
  }
</style>
</head>
<body>

<header>
  <svg class="contours" viewBox="0 0 900 180" preserveAspectRatio="none">
    <path d="M-20 150 Q 160 90 340 140 T 700 120 T 940 155" stroke="#4f6a52" stroke-width="1.4" fill="none"/>
    <path d="M-20 60 Q 200 -5 420 50 T 780 28 T 940 55" stroke="#b9812f" stroke-width="1" fill="none" opacity="0.4"/>
  </svg>
  <div class="header-inner">
    <h1>小百岳紀錄，<em>一步一腳印</em></h1>
    <div class="progress-row">
      <svg class="ring" viewBox="0 0 74 74">
        <circle cx="37" cy="37" r="31" fill="none" stroke="#d8d1bd" stroke-width="7"/>
        <circle id="ringProgress" cx="37" cy="37" r="31" fill="none" stroke="#4f6a52" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="194.8" transform="rotate(-90 37 37)"/>
        <text x="37" y="42" text-anchor="middle" font-size="17" fill="#232c22" id="ringText">0</text>
      </svg>
      <div class="stat-block">
        <div class="stat"><div class="n" id="statDone">0</div><div class="l">已完成</div></div>
        <div class="stat"><div class="n">100</div><div class="l">總座數</div></div>
        <div class="stat"><div class="n" id="statPct">0%</div><div class="l">完成率</div></div>
      </div>
    </div>
    <div class="trailbar"><div class="trailbar-fill" id="trailFill" style="width:0%"></div></div>
    <button class="sharebtn" id="shareBtn">
      <svg viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>
      分享我的進度（唯讀連結）
    </button>
  </div>
</header>

<div class="wrap">
  <div class="searchrow" id="searchrow">
    <div class="searchbox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchBox" placeholder="搜尋山名或地點…">
    </div>
    <button class="filterbtn" id="filterToggle">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span>篩選</span>
      <span class="badge" id="filterBadge" style="display:none">0</span>
    </button>
    <button class="statsbtn" id="statsToggle">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>統計</span>
    </button>
  </div>

  <div class="statspanel" id="statsPanel">
    <div class="statspanel-inner" id="statsInner"></div>
  </div>

  <div class="panel" id="panel">
    <div class="panel-inner">
      <div class="panel-group">
        <div class="panel-label">難度</div>
        <div class="pillbar" id="tierPills"></div>
      </div>
      <div class="panel-group">
        <div class="panel-label">地區（可複選）</div>
        <div class="pillbar scrollrow" id="countyPills"></div>
      </div>
      <div class="panel-group">
        <div class="panel-label">狀態</div>
        <div class="pillbar" id="statusPills">
          <button class="pill active neutral" data-status="">全部</button>
          <button class="pill" data-status="done">已完成</button>
          <button class="pill" data-status="todo">未完成</button>
        </div>
      </div>
    </div>
  </div>

  <div id="listArea"></div>
</div>

<footer>
  資料整理自公開登山與難度分級資訊，僅供參考，實際路況請以現場標示與最新山岳資訊為準。<br>
  這份紀錄只存在你這台裝置裡。想給別人看，用上面的「分享我的進度」產生唯讀連結。
</footer>

<div class="modal-overlay" id="shareModal">
  <div class="modal-box">
    <h3>分享唯讀連結</h3>
    <p>這個連結包含你目前的進度快照，別人打開只能看、不能改。之後你有新進度，要重新產生一次新連結。</p>
    <div class="modal-linkbox">
      <input type="text" id="shareLinkInput" readonly>
      <button class="modal-copy" id="copyLinkBtn" style="flex:none;padding:8px 12px;">複製</button>
    </div>
    <div class="modal-actions">
      <button class="modal-save" id="nativeShareBtn">用手機分享功能傳送</button>
    </div>
    <button class="modal-skip" id="shareCloseBtn">關閉</button>
  </div>
</div>

const PEAKS = PEAKS_RAW.map(([id,name,county,elev,tier,dist,time,gain])=>{
  const primaryCounty = county.split(/／/)[0].replace(/（.*?）/,'');
  return {id,name,county,primaryCounty,elev,tier,dist,time,gain};
});

const TIER_INFO = {
  1:{label:"Lv.1 輕鬆入門",short:"Lv.1",color:"#7a9e7d"},
  2:{label:"Lv.2 基礎體驗",short:"Lv.2",color:"#4f6a52"},
  3:{label:"Lv.3 半日挑戰",short:"Lv.3",color:"#b9812f"},
  4:{label:"Lv.4 進階訓練",short:"Lv.4",color:"#a1573c"},
  5:{label:"Lv.5 百岳前哨",short:"Lv.5",color:"#7a3b2e"},
};

function fmtTime(min){
  if(min < 60) return min + '分';
  const h = Math.floor(min/60), r = min%60;
  if(r===0) return h + '小時';
  return h + '小時' + r + '分';
}

/* ---------- State (all local to this device) ---------- */
let progress = {};       // {peakId: {done,date,summary}}
let openId = null;
let activeTier = '';
let activeCounties = new Set();
let activeStatus = '';
const STORAGE_KEY = "xiaobaiyue-progress-v1";

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) progress = JSON.parse(raw);
  }catch(e){ console.error("load failed", e); }
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){
    console.error("save failed", e);
    showToast('儲存失敗，裝置儲存空間可能不足');
  }
}
function commitEntry(id, entry){
  progress[id] = entry;
  saveProgress();
}

function showToast(msg){
  let toast = document.getElementById('saveToast');
  if(!toast){
    toast = document.createElement('div');
    toast.id = 'saveToast';
    toast.className = 'save-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>toast.classList.remove('show'), 2600);
}

/* ---------- Share link generation ---------- */
function buildShareLink(){
  const compact = {};
  PEAKS.forEach(p=>{
    const st = progress[p.id];
    if(st && st.done){
      compact[p.id] = [st.date || '', st.summary || ''];
    }
  });
  const json = JSON.stringify(compact);
  const packed = LZString.compressToEncodedURIComponent(json);
  const base = location.href.replace(/index\.html.*$/, '').replace(/\/?$/, '/');
  return base + 'viewer.html#s=' + packed;
}

document.getElementById('shareBtn').addEventListener('click', ()=>{
  const link = buildShareLink();
  document.getElementById('shareLinkInput').value = link;
  document.getElementById('shareModal').classList.add('show');
});
document.getElementById('shareCloseBtn').addEventListener('click', ()=>{
  document.getElementById('shareModal').classList.remove('show');
});
document.getElementById('copyLinkBtn').addEventListener('click', async ()=>{
  const val = document.getElementById('shareLinkInput').value;
  try{
    await navigator.clipboard.writeText(val);
    showToast('已複製連結');
  }catch(e){
    document.getElementById('shareLinkInput').select();
    document.execCommand('copy');
    showToast('已複製連結');
  }
});
document.getElementById('nativeShareBtn').addEventListener('click', async ()=>{
  const val = document.getElementById('shareLinkInput').value;
  if(navigator.share){
    try{ await navigator.share({title:'我的小百岳進度', url: val}); }
    catch(e){ /* user cancelled, ignore */ }
  } else {
    showToast('這台裝置不支援原生分享，請用複製連結');
  }
});

/* ---------- Filters UI ---------- */
function buildTierPills(){
  const bar = document.getElementById('tierPills');
  const allPill = document.createElement('button');
  allPill.className = 'pill active neutral';
  allPill.textContent = '全部';
  allPill.dataset.tier = '';
  bar.appendChild(allPill);
  for(let t=1;t<=5;t++){
    const info = TIER_INFO[t];
    const p = document.createElement('button');
    p.className = 'pill';
    p.dataset.tier = t;
    p.innerHTML = `<span class="dot" style="background:${info.color}"></span>${info.short}`;
    bar.appendChild(p);
  }
  bar.addEventListener('click', (e)=>{
    const btn = e.target.closest('.pill');
    if(!btn) return;
    activeTier = btn.dataset.tier;
    [...bar.children].forEach(c=>{
      const on = c.dataset.tier === activeTier;
      c.classList.toggle('active', on);
      if(c.dataset.tier === ''){ return; }
      const n = Number(c.dataset.tier);
      c.style.background = on ? TIER_INFO[n].color : '';
      c.style.borderColor = on ? TIER_INFO[n].color : '';
      c.style.color = on ? '#fff' : '';
    });
    updateFilterBadge();
    render();
  });
}

function buildCountyPills(){
  const bar = document.getElementById('countyPills');
  const orderedCounties = [];
  PEAKS.forEach(p=>{ if(!orderedCounties.includes(p.primaryCounty)) orderedCounties.push(p.primaryCounty); });

  const allPill = document.createElement('button');
  allPill.className = 'pill active neutral';
  allPill.textContent = '全部';
  allPill.dataset.county = '';
  bar.appendChild(allPill);

  orderedCounties.forEach(c=>{
    const p = document.createElement('button');
    p.className = 'pill';
    p.dataset.county = c;
    p.textContent = c;
    bar.appendChild(p);
  });

  bar.addEventListener('click', (e)=>{
    const btn = e.target.closest('.pill');
    if(!btn) return;
    const val = btn.dataset.county;
    if(val === ''){
      activeCounties.clear();
    } else {
      if(activeCounties.has(val)) activeCounties.delete(val); else activeCounties.add(val);
    }
    [...bar.children].forEach(c=>{
      if(c.dataset.county === ''){
        c.classList.toggle('active', activeCounties.size===0);
      } else {
        c.classList.toggle('active', activeCounties.has(c.dataset.county));
      }
    });
    updateFilterBadge();
    render();
  });
}

function buildStatusPills(){
  const bar = document.getElementById('statusPills');
  bar.addEventListener('click', (e)=>{
    const btn = e.target.closest('.pill');
    if(!btn) return;
    activeStatus = btn.dataset.status;
    [...bar.children].forEach(c=>c.classList.toggle('active', c===btn));
    updateFilterBadge();
    render();
  });
}

function updateFilterBadge(){
  let count = 0;
  if(activeTier !== '') count++;
  if(activeCounties.size > 0) count++;
  if(activeStatus !== '') count++;
  const badge = document.getElementById('filterBadge');
  const btn = document.getElementById('filterToggle');
  if(count > 0){
    badge.style.display='flex'; badge.textContent = count;
    btn.style.borderColor = 'var(--moss)';
  } else {
    badge.style.display='none';
    btn.style.borderColor = '';
  }
}

document.getElementById('filterToggle').addEventListener('click', ()=>{
  document.getElementById('panel').classList.toggle('open');
  document.getElementById('statsPanel').classList.remove('open');
});
document.getElementById('statsToggle').addEventListener('click', ()=>{
  document.getElementById('statsPanel').classList.toggle('open');
  document.getElementById('panel').classList.remove('open');
  renderStats();
});

function renderStats(){
  const inner = document.getElementById('statsInner');
  const doneEntries = PEAKS
    .map(p=>({p, state: progress[p.id]}))
    .filter(x=>x.state && x.state.done && x.state.date);

  if(doneEntries.length === 0){
    inner.innerHTML = `<div class="stats-empty">還沒有帶日期的攻頂紀錄，打勾並填上日期後，這裡就會出現每月趨勢。</div>`;
    return;
  }

  const counts = {};
  doneEntries.forEach(({state})=>{
    const ym = state.date.slice(0,7);
    counts[ym] = (counts[ym]||0) + 1;
  });
  const months = Object.keys(counts).sort();
  const first = months[0], last = months[months.length-1];

  function addMonth(ym, n){
    let [y,m] = ym.split('-').map(Number);
    m += n;
    while(m>12){m-=12;y++;}
    while(m<1){m+=12;y--;}
    return y+'-'+String(m).padStart(2,'0');
  }
  let range = [first];
  let cur = first;
  while(cur !== last && range.length < 24){
    cur = addMonth(cur,1);
    range.push(cur);
  }
  if(range.length > 18) range = range.slice(range.length-18);

  const max = Math.max(...range.map(ym=>counts[ym]||0), 1);
  const totalDone = doneEntries.length;
  const best = months.reduce((a,b)=> (counts[b]>counts[a]?b:a), months[0]);
  const avgPerMonth = (totalDone / range.length).toFixed(1);

  const chartHtml = range.map(ym=>{
    const c = counts[ym] || 0;
    const h = Math.round((c/max)*76);
    const [y,m] = ym.split('-');
    return `<div class="chart-col">
      <span class="chart-count">${c||''}</span>
      <div class="chart-bar-wrap"><div class="chart-bar ${c===0?'zero':''}" style="height:${Math.max(h,2)}px"></div></div>
      <span class="chart-label">${m}月</span>
    </div>`;
  }).join('');

  inner.innerHTML = `
    <div class="stats-summary">
      <div class="stat"><div class="n">${totalDone}</div><div class="l">已記錄攻頂</div></div>
      <div class="stat"><div class="n">${best.replace('-','/')}</div><div class="l">最活躍月份</div></div>
      <div class="stat"><div class="n">${avgPerMonth}</div><div class="l">平均每月座數</div></div>
    </div>
    <div class="chart">${chartHtml}</div>
  `;
}

function matchesFilters(p){
  const q = document.getElementById('searchBox').value.trim();
  const done = !!(progress[p.id] && progress[p.id].done);
  if(q && !(p.name.includes(q) || p.county.includes(q))) return false;
  if(activeTier !== '' && p.tier !== Number(activeTier)) return false;
  if(activeCounties.size > 0 && !activeCounties.has(p.primaryCounty)) return false;
  if(activeStatus === 'done' && !done) return false;
  if(activeStatus === 'todo' && done) return false;
  return true;
}

function render(){
  const listArea = document.getElementById('listArea');
  listArea.innerHTML = '';
  const filtered = PEAKS.filter(matchesFilters);

  if(filtered.length === 0){
    listArea.innerHTML = `<div class="empty">沒有符合條件的山峰，換個關鍵字或篩選試試。</div>`;
    updateStats();
    return;
  }

  for(let t=1;t<=5;t++){
    const group = filtered.filter(p=>p.tier===t);
    if(group.length===0) continue;
    appendSection(listArea, TIER_INFO[t].label, TIER_INFO[t], group);
  }
  updateStats();
}

function appendSection(container, title, tierInfo, peaks){
  const doneInGroup = peaks.filter(p=>progress[p.id]&&progress[p.id].done).length;
  const section = document.createElement('div');
  section.className = 'tier-section';
  section.innerHTML = `
    <div class="tier-head">
      ${tierInfo ? `<span class="tier-dot" style="background:${tierInfo.color}"></span>` : ''}
      <h2>${title}</h2>
      <span class="count">${doneInGroup}/${peaks.length}</span>
    </div>
    <div class="tier-list"></div>
  `;
  const listEl = section.querySelector('.tier-list');
  peaks.forEach(p=>listEl.appendChild(renderPeak(p)));
  container.appendChild(section);
}

function renderPeak(p){
  const state = progress[p.id] || {done:false,date:'',summary:''};
  const el = document.createElement('div');
  el.className = 'peak' + (state.done ? ' done' : '') + (openId===p.id ? ' open' : '');
  const info = TIER_INFO[p.tier];
  el.style.borderLeftColor = info.color;

  let previewHtml = '';
  if(state.done && (state.date || state.summary)){
    const sumTxt = state.summary ? state.summary.replace(/\n/g,' ') : '尚未填寫心得';
    previewHtml = `<div class="preview"><span class="pdate">✓ ${state.date||''}</span> <span class="ptxt">${sumTxt}</span></div>`;
  }

  el.innerHTML = `
    <div class="peak-row" data-toggle="${p.id}">
      <div class="checkbox" data-check="${p.id}">
        <svg viewBox="0 0 24 24"><polyline points="4 12 9 18 20 6"/></svg>
      </div>
      <div class="peak-main">
        <span class="peak-num">No.${String(p.id).padStart(3,'0')}</span><span class="peak-name">${p.name}</span><span class="peak-county">${p.county}</span>
        <div class="peak-facts">${p.elev}m ・ ${p.dist}km ・ ${fmtTime(p.time)}</div>
        ${previewHtml}
      </div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 6 15 12 9 18"/>
      </svg>
    </div>
    <div class="peak-detail">
      <div class="field">
        <label>攻頂日期</label>
        <input type="date" data-date="${p.id}" value="${state.date||''}">
      </div>
      <div class="field">
        <label>心得摘要</label>
        <textarea data-summary="${p.id}" placeholder="路況、天氣、同行夥伴、想記住的瞬間…">${state.summary||''}</textarea>
      </div>
    </div>
  `;

  el.querySelector('[data-toggle]').addEventListener('click', (e)=>{
    if(e.target.closest('[data-check]')) return;
    openId = (openId === p.id) ? null : p.id;
    render();
  });
  el.querySelector('[data-check]').addEventListener('click', (e)=>{
    e.stopPropagation();
    const cur = progress[p.id] || {done:false,date:'',summary:''};
    cur.done = !cur.done;
    if(cur.done && !cur.date){ cur.date = new Date().toISOString().slice(0,10); }
    commitEntry(p.id, cur);
    if(cur.done) openId = p.id;
    render();
  });
  el.querySelector('[data-date]').addEventListener('change', (e)=>{
    const cur = progress[p.id] || {done:false,date:'',summary:''};
    cur.date = e.target.value;
    commitEntry(p.id, cur);
  });
  el.querySelector('[data-summary]').addEventListener('input', (e)=>{
    const cur = progress[p.id] || {done:false,date:'',summary:''};
    cur.summary = e.target.value;
    commitEntry(p.id, cur);
  });

  return el;
}

function updateStats(){
  const doneCount = PEAKS.filter(p=>progress[p.id]&&progress[p.id].done).length;
  const pct = Math.round(doneCount/100*100);
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('trailFill').style.width = pct + '%';
  const circumference = 194.8;
  const offset = circumference - (circumference * pct/100);
  document.getElementById('ringProgress').style.strokeDashoffset = offset;
  document.getElementById('ringText').textContent = doneCount;
}

document.getElementById('searchBox').addEventListener('input', render);

window.addEventListener('scroll', ()=>{
  const c = document.getElementById('searchrow');
  if(window.scrollY > 180) c.classList.add('stuck'); else c.classList.remove('stuck');
});

(function init(){
  buildTierPills();
  buildCountyPills();
  buildStatusPills();
  loadProgress();
  render();
})();
