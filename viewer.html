<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小百岳紀錄（分享檢視）</title>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#37472f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>
  :root{
    --paper:#eae5d8;
    --paper-2:#e0dac9;
    --ink:#232c22;
    --ink-soft:#5a6455;
    --moss:#4f6a52;
    --moss-dark:#37472f;
    --ochre:#b9812f;
    --clay:#a1573c;
    --brick:#7a3b2e;
    --line:#c9c0a8;
    --card:#f4f0e4;
    --done-bg:#e2e8d8;
    --shadow: 0 1px 2px rgba(35,44,34,0.05);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px;}

  header{
    position:relative;overflow:hidden;padding:48px 20px 26px;
    background:linear-gradient(180deg,var(--paper-2),var(--paper));border-bottom:1px solid var(--line);
  }
  header .contours{position:absolute;inset:0;opacity:0.5;pointer-events:none;}
  .header-inner{max-width:900px;margin:0 auto;position:relative;z-index:1;}
  .readonly-tag{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;color:var(--moss-dark);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  }
  h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5.6vw,42px);
    line-height:1.05;margin:0 0 16px;letter-spacing:-0.01em;
  }
  h1 em{font-style:italic;font-weight:400;color:var(--moss);}

  .progress-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .ring{width:58px;height:58px;flex:none;}
  .stat-block{display:flex;gap:20px;flex-wrap:wrap;}
  .stat .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--moss-dark);line-height:1;}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin-top:3px;}
  .trailbar{margin-top:14px;height:6px;border-radius:5px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden;}
  .trailbar-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--ochre));border-radius:5px;}

  .searchrow{
    position:sticky;top:0;background:var(--paper);z-index:6;padding:16px 0;border-bottom:1px solid transparent;
  }
  .searchrow.stuck{border-bottom-color:var(--line);}
  .searchbox{
    display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:0 12px;
  }
  .searchbox svg{width:16px;height:16px;stroke:var(--ink-soft);fill:none;stroke-width:2;flex:none;}
  .searchbox input{
    flex:1;min-width:0;width:100%;border:none;background:transparent;font-family:'Inter',sans-serif;
    font-size:14.5px;padding:10px 0;color:var(--ink);
  }
  .searchbox input:focus{outline:none;}

  .tier-section{margin-bottom:28px;}
  .tier-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding-bottom:7px;margin-bottom:9px;border-bottom:2px solid var(--ink);}
  .tier-head h2{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin:0;}
  .tier-head .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-left:auto;}
  .tier-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}

  .peak{
    background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);
    border-radius:9px;margin-bottom:8px;box-shadow:var(--shadow);
  }
  .peak.done{background:var(--done-bg);}
  .peak-row{padding:12px 14px;}
  .peak-top{display:flex;align-items:flex-start;gap:10px;}
  .checkmark{
    width:23px;height:23px;border-radius:7px;border:2px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .peak.done .checkmark{background:var(--moss);border-color:var(--moss);}
  .checkmark svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none;}
  .peak.done .checkmark svg{display:block;}
  .peak-main{flex:1;min-width:0;}
  .peak-num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);margin-right:6px;}
  .peak-name{font-weight:600;font-size:15px;}
  .peak-county{font-size:12px;color:var(--ink-soft);margin-left:6px;}
  .peak-facts{font-size:12px;color:var(--ink-soft);margin-top:4px;font-family:'JetBrains Mono',monospace;}
  .note{margin-top:8px;font-size:12.5px;line-height:1.5;padding-top:8px;border-top:1px solid var(--line);}
  .note .pdate{color:var(--moss-dark);font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11.5px;}
  .note .ptxt{color:var(--ink-soft);white-space:pre-wrap;margin-top:4px;}

  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13.5px;}
  footer{text-align:center;padding:30px 20px;font-size:12px;color:var(--ink-soft);}

  @media (max-width:480px){ .peak-county{display:none;} }
</style>
</head>
<body>

<header>
  <svg class="contours" viewBox="0 0 900 180" preserveAspectRatio="none">
    <path d="M-20 150 Q 160 90 340 140 T 700 120 T 940 155" stroke="#4f6a52" stroke-width="1.4" fill="none"/>
    <path d="M-20 60 Q 200 -5 420 50 T 780 28 T 940 55" stroke="#b9812f" stroke-width="1" fill="none" opacity="0.4"/>
  </svg>
  <div class="header-inner">
    <div class="readonly-tag">👀 唯讀分享・僅供瀏覽</div>
    <h1>小百岳紀錄，<em>一步一腳印</em></h1>
    <div class="progress-row">
      <svg class="ring" viewBox="0 0 74 74">
        <circle cx="37" cy="37" r="31" fill="none" stroke="#d8d1bd" stroke-width="7"/>
        <circle id="ringProgress" cx="37" cy="37" r="31" fill="none" stroke="#4f6a52" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="194.8" transform="rotate(-90 37 37)"/>
        <text x="37" y="42" text-anchor="middle" font-size="17" fill="#232c22" id="ringText">0</text>
      </svg>
      <div class="stat-block">
        <div class="stat"><div class="n" id="statDone">0</div><div class="l">已完成</div></div>
        <div class="stat"><div class="n">100</div><div class="l">總座數</div></div>
        <div class="stat"><div class="n" id="statPct">0%</div><div class="l">完成率</div></div>
      </div>
    </div>
    <div class="trailbar"><div class="trailbar-fill" id="trailFill" style="width:0%"></div></div>
  </div>
</header>

<div class="wrap">
  <div class="searchrow" id="searchrow">
    <div class="searchbox">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchBox" placeholder="搜尋山名或地點…">
    </div>
  </div>
  <div id="listArea"></div>
</div>

<footer>
  這是唯讀分享頁面，看得到的資料是分享者產生連結當下的進度快照，之後不會自動更新。
</footer>

const PEAKS = PEAKS_RAW.map(([id,name,county,elev,tier,dist,time,gain])=>{
  const primaryCounty = county.split(/／/)[0].replace(/（.*?）/,'');
  return {id,name,county,primaryCounty,elev,tier,dist,time,gain};
});

const TIER_INFO = {
  1:{label:"Lv.1 輕鬆入門",color:"#7a9e7d"},
  2:{label:"Lv.2 基礎體驗",color:"#4f6a52"},
  3:{label:"Lv.3 半日挑戰",color:"#b9812f"},
  4:{label:"Lv.4 進階訓練",color:"#a1573c"},
  5:{label:"Lv.5 百岳前哨",color:"#7a3b2e"},
};

function fmtTime(min){
  if(min < 60) return min + '分';
  const h = Math.floor(min/60), r = min%60;
  if(r===0) return h + '小時';
  return h + '小時' + r + '分';
}

let progress = {}; // {peakId: {done:true, date, summary}}

function loadFromHash(){
  const hash = location.hash;
  const m = hash.match(/s=([^&]+)/);
  if(!m) return false;
  try{
    const json = LZString.decompressFromEncodedURIComponent(m[1]);
    if(!json) return false;
    const compact = JSON.parse(json);
    progress = {};
    for(const id in compact){
      const [date, summary] = compact[id];
      progress[id] = {done:true, date, summary};
    }
    return true;
  }catch(e){
    console.error('failed to parse share link', e);
    return false;
  }
}

function render(){
  const listArea = document.getElementById('listArea');
  listArea.innerHTML = '';
  const q = document.getElementById('searchBox').value.trim();
  const filtered = PEAKS.filter(p => !q || p.name.includes(q) || p.county.includes(q));

  if(filtered.length === 0){
    listArea.innerHTML = `<div class="empty">沒有符合的山峰。</div>`;
    return;
  }

  for(let t=1;t<=5;t++){
    const group = filtered.filter(p=>p.tier===t);
    if(group.length===0) continue;
    const info = TIER_INFO[t];
    const doneInGroup = group.filter(p=>progress[p.id]&&progress[p.id].done).length;
    const section = document.createElement('div');
    section.className = 'tier-section';
    section.innerHTML = `
      <div class="tier-head">
        <span class="tier-dot" style="background:${info.color}"></span>
        <h2>${info.label}</h2>
        <span class="count">${doneInGroup}/${group.length}</span>
      </div>
      <div class="tier-list"></div>
    `;
    const listEl = section.querySelector('.tier-list');
    group.forEach(p=>listEl.appendChild(renderPeak(p)));
    listArea.appendChild(section);
  }
}

function renderPeak(p){
  const state = progress[p.id];
  const done = !!(state && state.done);
  const el = document.createElement('div');
  el.className = 'peak' + (done ? ' done' : '');
  const info = TIER_INFO[p.tier];
  el.style.borderLeftColor = info.color;

  let noteHtml = '';
  if(done && (state.date || state.summary)){
    noteHtml = `<div class="note"><span class="pdate">✓ ${state.date||''}</span><div class="ptxt">${(state.summary||'（尚未填寫心得）')}</div></div>`;
  }

  el.innerHTML = `
    <div class="peak-row">
      <div class="peak-top">
        <div class="checkmark"><svg viewBox="0 0 24 24"><polyline points="4 12 9 18 20 6"/></svg></div>
        <div class="peak-main">
          <span class="peak-num">No.${String(p.id).padStart(3,'0')}</span><span class="peak-name">${p.name}</span><span class="peak-county">${p.county}</span>
          <div class="peak-facts">${p.elev}m ・ ${p.dist}km ・ ${fmtTime(p.time)}</div>
        </div>
      </div>
      ${noteHtml}
    </div>
  `;
  return el;
}

function updateStats(){
  const doneCount = PEAKS.filter(p=>progress[p.id]&&progress[p.id].done).length;
  const pct = Math.round(doneCount/100*100);
  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statPct').textContent = pct + '%';
  document.getElementById('trailFill').style.width = pct + '%';
  const circumference = 194.8;
  const offset = circumference - (circumference * pct/100);
  document.getElementById('ringProgress').style.strokeDashoffset = offset;
  document.getElementById('ringText').textContent = doneCount;
}

document.getElementById('searchBox').addEventListener('input', render);
window.addEventListener('scroll', ()=>{
  const c = document.getElementById('searchrow');
  if(window.scrollY > 140) c.classList.add('stuck'); else c.classList.remove('stuck');
});

(function init(){
  const ok = loadFromHash();
  if(!ok){
    document.getElementById('listArea').innerHTML =
      '<div class="empty">這個連結沒有帶進度資料，請確認是用「分享我的進度」產生的完整連結。</div>';
  } else {
    render();
  }
  updateStats();
})();
</script>
</body>
</html>
